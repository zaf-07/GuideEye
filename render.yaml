services:
  - type: web
    name: guideeye
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BAND_AUTOCONNECT
        value: "false"
      - key: SPEECH_VOICE
        value: elevenlabs
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: HR_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SUPERMEMORY_API_KEY
        sync: false
