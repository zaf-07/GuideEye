name: GuideEye release builds
on:
  workflow_dispatch:
    inputs:
      release_tag: { description: 'Existing or new release tag', required: true, default: 'v0.1.0', type: string }
  push: { tags: ['v*'] }
permissions: { contents: write }
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle testDebugUnitTest assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk GuideBand-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: GuideBand-Android, path: GuideBand-Android.apk, if-no-files-found: error }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}", files: GuideBand-Android.apk }
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: '--mac --universal', artifact: macOS }
          - { os: windows-2025, target: '--win', artifact: Windows }
          - { os: ubuntu-24.04, target: '--linux', artifact: Linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run dist:desktop -- ${{ matrix.target }}
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: 'GuideBand-${{ matrix.artifact }}', path: 'release/*', if-no-files-found: error }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}"
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
